<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Rozmowa z Bogiem – Veil</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Rozmowa z Bogiem</h1>
    <p class="subtitle">Przesuń kursorem i klikaj, by odsłonić ukryte warstwy sagi.</p>

    <div id="veil-layer" class="veil">
      <div class="layer layer-1"></div>
      <div class="layer layer-2 hidden" id="layer2"></div>
      <div class="layer layer-3 hidden" id="layer3"></div>
      <div class="layer layer-4 hidden" id="layer4"></div> <!-- Nowa warstwa dla Ch.4 -->
      <div class="core hidden" id="core-reveal">
        <p id="final-message">Koherencja osiągnięta.</p>
      </div>
    </div>

    <nav class="chapter-nav">
      <a href="../classic/00_prolog.md" target="_blank">Prolog</a>
      <a href="../classic/01_zaslona_iluzji.md" target="_blank">Ch.1</a>
      <a href="../classic/02_duszenie_ego.md" target="_blank">Ch.2</a>
      <a href="../classic/03_rownowaga_sil.md" target="_blank">Ch.3</a>
      <a href="../classic/04_przebudzenie_mocy.md" target="_blank">Ch.4 (Nowy)</a>
    </nav>

    <div class="interaction-info">
      <p id="whisper">Dotknij… odsłoń mnie.</p>
      <p>Interakcje: <span id="count">0</span> / Koherencja: <span id="coherence">0</span>%</p>
      <button id="reset-btn" class="hidden">Nowa iteracja</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
